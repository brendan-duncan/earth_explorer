<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">GriddedField — one sampling contract for every feed</text>

  <!-- ── Left: the full-globe grid ─────────────────────────────────────────── -->
  <text x="202" y="62" text-anchor="middle" font-weight="600" font-size="12.5" fill="#111827">Full-globe equirect placement</text>

  <!-- axis labels -->
  <text x="40" y="78" font-size="10.5" fill="#6b7280">−180°</text>
  <text x="364" y="78" text-anchor="end" font-size="10.5" fill="#6b7280">+180°</text>
  <text x="34" y="94" text-anchor="end" font-size="10.5" fill="#6b7280">+90°</text>
  <text x="34" y="246" text-anchor="end" font-size="10.5" fill="#6b7280">−90°</text>

  <rect x="40" y="82" width="324" height="162" fill="#f1f5f9" stroke="#94a3b8"/>
  <!-- polar strips with no data (e.g. WaveWatch) -->
  <rect x="40" y="82" width="324" height="12" fill="#e2e8f0"/>
  <rect x="40" y="232" width="324" height="12" fill="#e2e8f0"/>
  <text x="202" y="91.5" text-anchor="middle" font-size="9.5" fill="#94a3b8">no rows from the feed → mask = 0</text>
  <!-- covered band -->
  <rect x="40" y="94" width="324" height="138" fill="#dbeafe"/>
  <text x="202" y="158" text-anchor="middle" font-size="11" fill="#1d4ed8">feed coverage lands at its true rows</text>
  <text x="202" y="175" text-anchor="middle" font-size="10.5" fill="#3b82f6">(WaveWatch III: ±77° · currents: ±64.7°)</text>
  <!-- grid ticks (inside the covered band only, clear of the strip labels) -->
  <line x1="121" y1="94" x2="121" y2="232" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="202" y1="94" x2="202" y2="232" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="283" y1="94" x2="283" y2="232" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="40" y1="196" x2="364" y2="196" stroke="#cbd5e1" stroke-width="0.6"/>

  <text x="202" y="266" text-anchor="middle" font-size="11" fill="#6b7280">row 0 = north · col 0 = −180° (0..360° inputs re-centered)</text>
  <text x="202" y="282" text-anchor="middle" font-size="11" fill="#6b7280">destination cell = round((lon+180)/Δlon), round((90−lat)/Δlat)</text>
  <text x="202" y="298" text-anchor="middle" font-size="11" fill="#6b7280">grid spacing inferred from the (possibly strided) response</text>

  <!-- ── Right: channel layouts ─────────────────────────────────────────────── -->
  <text x="540" y="62" text-anchor="middle" font-weight="600" font-size="12.5" fill="#111827">Scalar layers — rgba8</text>
  <g>
    <rect x="420" y="72" width="24" height="24" rx="4" fill="#fecaca" stroke="#f87171"/>
    <text x="432" y="89" text-anchor="middle" font-weight="700" font-size="12">R</text>
    <text x="452" y="88" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">value byte, normalized min..max</text>

    <rect x="420" y="104" width="24" height="24" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
    <text x="432" y="121" text-anchor="middle" font-weight="700" font-size="12">G</text>
    <text x="452" y="120" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">= R  (grayscale readback)</text>

    <rect x="420" y="136" width="24" height="24" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
    <text x="432" y="153" text-anchor="middle" font-weight="700" font-size="12">B</text>
    <text x="452" y="152" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">= R</text>

    <rect x="420" y="168" width="24" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="432" y="185" text-anchor="middle" font-weight="700" font-size="12">A</text>
    <text x="452" y="184" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">valid mask: 255 data / 0 none</text>
  </g>

  <text x="800" y="62" text-anchor="middle" font-weight="600" font-size="12.5" fill="#111827">Vector layers — rgba8</text>
  <g>
    <rect x="680" y="72" width="24" height="24" rx="4" fill="#fecaca" stroke="#f87171"/>
    <text x="692" y="89" text-anchor="middle" font-weight="700" font-size="12">R</text>
    <text x="712" y="88" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">u  →  u/uMax·0.5 + 0.5</text>

    <rect x="680" y="104" width="24" height="24" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
    <text x="692" y="121" text-anchor="middle" font-weight="700" font-size="12">G</text>
    <text x="712" y="120" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">v  →  v/uMax·0.5 + 0.5</text>

    <rect x="680" y="136" width="24" height="24" rx="4" fill="#bfdbfe" stroke="#60a5fa"/>
    <text x="692" y="153" text-anchor="middle" font-weight="700" font-size="12">B</text>
    <text x="712" y="152" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">speed / uMax</text>

    <rect x="680" y="168" width="24" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="692" y="185" text-anchor="middle" font-weight="700" font-size="12">A</text>
    <text x="712" y="184" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">valid mask</text>
  </g>

  <!-- Decode box -->
  <rect x="420" y="222" width="500" height="104" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="670" y="243" text-anchor="middle" font-weight="600" font-size="12.5">Decode (shader and CPU sample() agree)</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#374151">
    <text x="438" y="268">v = min + (R/255)·(max − min)</text>
    <text x="700" y="268" fill="#6b7280">// linear layers</text>
    <text x="438" y="288">v = 10^(log₁₀min + (R/255)·logSpan)</text>
    <text x="700" y="288" fill="#6b7280">// chl, rain (log)</text>
    <text x="438" y="308">u = (R/255 − 0.5)·2·uMax</text>
    <text x="700" y="308">v = (G/255 − 0.5)·2·uMax</text>
  </g>

  <!-- Bottom note -->
  <text x="470" y="372" text-anchor="middle" font-size="11.5" fill="#6b7280">Scalar frames also retain their CPU cells (value bytes + mask) — point readouts, the Δ/min/max/range views,</text>
  <text x="470" y="390" text-anchor="middle" font-size="11.5" fill="#6b7280">and the analysis graph all run without GPU readback. Vector frames retain physical (u, v) when loaded</text>
  <text x="470" y="408" text-anchor="middle" font-size="11.5" fill="#6b7280">with retainCells (used by wind/current analysis and point wind readouts).</text>
</svg>
