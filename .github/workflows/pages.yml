# Builds the app and publishes dist/ to GitHub Pages when a version tag (v1.0.0, v0.2, …) is pushed.
# One-time setup:
#  - Settings → Pages → Build and deployment → Source: "GitHub Actions".
#  - Settings → Environments → github-pages → Deployment branches and tags: add a TAG rule `v*`.
#    The environment only allows the default branch out of the box, so a tag deploy is rejected
#    until that rule exists.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
