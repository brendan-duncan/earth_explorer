<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Earth Explorer — data pipeline</text>

  <text x="137" y="54" text-anchor="middle" font-weight="600" fill="#6b7280" font-size="12">DATA SOURCES</text>
  <text x="430" y="54" text-anchor="middle" font-weight="600" fill="#6b7280" font-size="12">NORMALIZE</text>
  <text x="790" y="54" text-anchor="middle" font-weight="600" fill="#6b7280" font-size="12">COMPOSITE &amp; DISPLAY</text>

  <!-- Sources -->
  <g font-size="11">
    <rect x="20" y="64" width="235" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="137" y="80" text-anchor="middle" font-weight="600" font-size="12">NCEI ERDDAP</text>
    <text x="137" y="96" text-anchor="middle" fill="#6b7280">OISST top-up · PERSIANN-CDR · Niño 3.4</text>

    <rect x="20" y="110" width="235" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="137" y="126" text-anchor="middle" font-weight="600" font-size="12">PacIOOS ERDDAP</text>
    <text x="137" y="142" text-anchor="middle" fill="#6b7280">GFS atmosphere + wind · WW3 · Coral Reef Watch</text>

    <rect x="20" y="156" width="235" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="137" y="172" text-anchor="middle" font-weight="600" font-size="12">GIBS · NOAA STAR · RainViewer</text>
    <text x="137" y="188" text-anchor="middle" fill="#6b7280">VIIRS true color · GOES GeoColor · radar</text>

    <rect x="20" y="202" width="235" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="137" y="218" text-anchor="middle" font-weight="600" font-size="12">OBIS · IOOS ATN · GFW (token)</text>
    <text x="137" y="234" text-anchor="middle" fill="#6b7280">species grids · animal tracks · fishing effort</text>

    <rect x="20" y="248" width="235" height="40" rx="6" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="137" y="264" text-anchor="middle" font-weight="600" font-size="12">ArcGIS feature services</text>
    <text x="137" y="280" text-anchor="middle" fill="#6b7280">NHC cyclones · NIFC fires · VIIRS hotspots · USFS</text>

    <rect x="20" y="294" width="235" height="40" rx="6" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="137" y="310" text-anchor="middle" font-weight="600" font-size="12">Natural Earth (jsDelivr)</text>
    <text x="137" y="326" text-anchor="middle" fill="#6b7280">borders + cities at 1:110M / 50M / 10M</text>

    <rect x="20" y="340" width="235" height="40" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="137" y="356" text-anchor="middle" font-weight="600" font-size="12">Zoom detail tiles</text>
    <text x="137" y="372" text-anchor="middle" fill="#6b7280">Blue Marble · Esri World Imagery</text>

    <rect x="20" y="386" width="235" height="40" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="137" y="402" text-anchor="middle" font-weight="600" font-size="12">Baked atlases (Node, no CORS)</text>
    <text x="137" y="418" text-anchor="middle" fill="#6b7280">OISST 1981→ · currents · chl · GPCP · land anom</text>

    <rect x="20" y="432" width="235" height="40" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="137" y="448" text-anchor="middle" font-weight="600" font-size="12">Baked assets</text>
    <text x="137" y="464" text-anchor="middle" fill="#6b7280">ETOPO · basemap · night lights · ONI</text>
  </g>

  <!-- bus to loaders (fields) -->
  <g stroke="#94a3b8">
    <line x1="255" y1="84" x2="272" y2="84"/><line x1="255" y1="130" x2="272" y2="130"/>
    <line x1="255" y1="176" x2="272" y2="176"/><line x1="255" y1="222" x2="272" y2="222"/>
    <line x1="255" y1="406" x2="272" y2="406"/><line x1="255" y1="452" x2="272" y2="452"/>
    <line x1="272" y1="84" x2="272" y2="452"/>
  </g>
  <line x1="272" y1="150" x2="305" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Loaders -->
  <rect x="305" y="64" width="250" height="166" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="430" y="84" text-anchor="middle" font-weight="600" font-size="12.5">Field loaders (src/live/)</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#374151">
    <text x="316" y="104">loadScalar / loadScalarDaily</text>
    <text x="316" y="121">loadVector · loadBakedStack</text>
    <text x="316" y="138">loadGibsDay · loadGeoComposite</text>
    <text x="316" y="155">loadObisGrid · loadGfwEffortStack</text>
    <text x="316" y="172">loadRadarOverlay (texture only)</text>
  </g>
  <text x="430" y="198" text-anchor="middle" font-size="10.5" fill="#6b7280">streamPool(width 3) · newest-first</text>
  <text x="430" y="214" text-anchor="middle" font-size="10.5" fill="#6b7280">.das ranges · coverage floors · retries</text>
  <line x1="430" y1="230" x2="430" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="305" y="258" width="250" height="84" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="430" y="278" text-anchor="middle" font-weight="600" font-size="12.5">GriddedField (one per frame)</text>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="430" y="297">equirect rgba8 texture, full globe</text>
    <text x="430" y="314">CPU cells: value byte + mask / (u,v)</text>
    <text x="430" y="331">meta: min · max · log · date · width</text>
  </g>

  <!-- Vector geometry path -->
  <g stroke="#94a3b8">
    <line x1="255" y1="268" x2="285" y2="268"/><line x1="255" y1="314" x2="285" y2="314"/>
    <line x1="255" y1="222" x2="285" y2="222"/>
    <line x1="285" y1="222" x2="285" y2="390"/>
  </g>
  <line x1="285" y1="390" x2="305" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="364" width="250" height="70" rx="6" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="430" y="384" text-anchor="middle" font-weight="600" font-size="12.5">Annotation rasters (OffscreenCanvas)</text>
  <text x="430" y="402" text-anchor="middle" font-size="11" fill="#374151">storms · fires · borders · tracks · shapes · arrows</text>
  <text x="430" y="420" text-anchor="middle" font-size="11" fill="#6b7280">equirect, cropped to the visible window</text>

  <!-- Flow -->
  <rect x="640" y="64" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="790" y="80" text-anchor="middle" font-weight="600" font-size="12">FlowOverlay ×2 (currents, wind)</text>
  <text x="790" y="96" text-anchor="middle" font-size="11" fill="#6b7280">compute advect → fading trail texture (windowed)</text>
  <line x1="790" y1="104" x2="790" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Fragment pass -->
  <rect x="640" y="128" width="300" height="200" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="790" y="148" text-anchor="middle" font-weight="600" font-size="12.5">One fullscreen pass — mapColor(uv)</text>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="790" y="168">20 bindings · 80-float uniform</text>
    <text x="790" y="186">crossfade / A-B compare · halo fix · flood fill</text>
    <text x="790" y="204">scale remap · bands · LUT · contours · stipple</text>
    <text x="790" y="222">over-land shading · flow · radar · day/night</text>
    <text x="790" y="240">overlay iso-lines + hatching</text>
    <text x="790" y="258">arrows · borders · tracks · storms · fires · shapes</text>
    <text x="790" y="276">detail-window basemap (Blue Marble / Esri)</text>
    <text x="790" y="304" fill="#6b7280">flat projections · orthographic globe · ray-marched earth</text>
  </g>
  <path d="M 555 300 L 600 300 L 600 230 L 638 230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 555 400 L 612 400 L 612 270 L 638 270" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 255 360 L 262 360 L 262 492 L 620 492 L 620 290 L 638 290" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>

  <!-- Screen -->
  <line x1="790" y1="328" x2="790" y2="466" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="468" width="300" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="790" y="488" text-anchor="middle" font-weight="600" font-size="12.5">Screen — one swap chain</text>
  <text x="790" y="505" text-anchor="middle" font-size="11" fill="#6b7280">one rAF loop, one submit per frame</text>

  <!-- Analysis -->
  <line x1="400" y1="342" x2="400" y2="356" stroke="#94a3b8"/>
  <path d="M 330 342 L 330 560" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="540" font-size="10.5" fill="#6b7280">same loaders</text>
  <rect x="220" y="562" width="440" height="76" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="440" y="583" text-anchor="middle" font-weight="600" font-size="12.5">Analysis graph (Web Worker)</text>
  <text x="440" y="601" text-anchor="middle" font-size="11" fill="#374151">FieldStore → 1° physical floats → 26-op typed dataflow programs</text>
  <text x="440" y="619" text-anchor="middle" font-size="11" fill="#6b7280">presets · Ask (LLM tool) · node editor · on-device CNN forecast</text>
  <path d="M 660 600 L 910 600 L 910 516" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="785" y="592" text-anchor="middle" font-size="10.5" fill="#6b7280">display / annotate / vectors sinks</text>

  <text x="480" y="670" text-anchor="middle" font-size="11" fill="#6b7280">blue = live gridded field · pink = live vector geometry · cyan = zoom detail tiles · amber = committed bake</text>
</svg>
